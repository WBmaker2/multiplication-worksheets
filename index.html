<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>몽실몽실 초등 2학년 두 자릿수 곱셈 연습장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <!-- html2canvas & jsPDF 라이브러리 (A4 PDF/PNG 고품질 다운로드 지원) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #FFF5F5;
      --text-color: #7B6B8D;
      --accent-pink: #FFB5C2;
      --accent-pink-soft: #FFE4E8;
      --accent-blue: #B5D8F7;
      --accent-blue-soft: #E5F1FC;
      --card-bg: rgba(255, 255, 255, 0.94);
      --box-border: #D8CCE0;
      --correct-color: #64B5F6;
      --shadow-soft: 0 10px 30px rgba(220, 190, 205, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Gowun Dodum', 'Gaegu', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 181, 194, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 90% 15%, rgba(181, 216, 247, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 50% 85%, rgba(255, 228, 232, 0.3) 0%, transparent 40%);
      background-attachment: fixed;
      padding: 24px 16px 40px;
    }

    /* 상단 장식 헤더 및 툴바 */
    .app-header {
      width: 100%;
      max-width: 920px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .deco-elements {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .cloud-icon, .star-icon, .balloon-icon {
      animation: floatSlow 4s ease-in-out infinite alternate;
    }
    .star-icon { animation-delay: 1s; }
    .balloon-icon { animation-delay: 2s; }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-7px) rotate(3deg); }
    }

    h1 {
      font-family: 'Jua', 'Gaegu', sans-serif;
      font-size: 2.25rem;
      color: #6C5980;
      text-shadow: 2px 2px 0px #FFE4E8;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #9887A8;
      margin-bottom: 16px;
    }

    /* 컨트롤 패널 */
    .controls-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 18px rgba(220, 190, 205, 0.22);
      border: 2px solid white;
      margin-bottom: 24px;
      max-width: 920px;
      width: 100%;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .page-tabs {
      display: flex;
      gap: 6px;
      background: var(--accent-pink-soft);
      padding: 4px;
      border-radius: 30px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .tab-btn.active {
      background: white;
      color: #E25B77;
      box-shadow: 0 2px 8px rgba(226, 91, 119, 0.2);
      transform: scale(1.05);
    }

    .tab-btn.answer-tab {
      background: #E8F2FC;
      color: #407BB5;
    }
    .tab-btn.answer-tab.active {
      background: #407BB5;
      color: white;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: white;
      color: var(--text-color);
      padding: 8px 15px;
      border-radius: 24px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(180, 160, 190, 0.15);
      border: 1.5px solid var(--accent-blue);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--accent-blue-soft);
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #FFB5C2, #FFA8B8);
      color: white;
      border: none;
      box-shadow: 0 3px 10px rgba(255, 181, 194, 0.4);
    }

    .action-btn.primary:hover {
      background: linear-gradient(135deg, #FF9FAA, #FF8F9E);
    }

    .action-btn.download-pdf {
      background: linear-gradient(135deg, #FF708F, #FF5277);
      color: white;
      border: none;
      box-shadow: 0 3px 10px rgba(255, 112, 143, 0.35);
    }
    .action-btn.download-pdf:hover {
      background: linear-gradient(135deg, #FF5277, #E03E64);
    }

    .action-btn.download-png {
      background: linear-gradient(135deg, #5CA3E8, #4088D6);
      color: white;
      border: none;
      box-shadow: 0 3px 10px rgba(92, 163, 232, 0.35);
    }
    .action-btn.download-png:hover {
      background: linear-gradient(135deg, #4088D6, #2E73C0);
    }

    /* 로딩 인디케이터 오버레이 */
    .download-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      color: white;
      font-family: 'Jua', sans-serif;
    }
    .download-overlay.show { display: flex; }
    .download-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: #FFB5C2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========================================================
       A4 용지 규격 최적화 (210mm x 297mm, 1:1.414 비율)
       화면 기준: 폭 800px × 최소높이 1130px
       ======================================================== */
    .worksheet-container {
      width: 100%;
      max-width: 820px;
      min-height: 1150px;
      background: var(--card-bg);
      border-radius: 36px;
      padding: 40px 42px 36px;
      box-shadow: var(--shadow-soft);
      border: 3px solid rgba(255, 255, 255, 0.95);
      position: relative;
      margin-bottom: 30px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 코너 장식 */
    .corner-deco {
      position: absolute;
      width: 44px;
      height: 44px;
      pointer-events: none;
      opacity: 0.85;
    }
    .corner-tl { top: 16px; left: 16px; }
    .corner-tr { top: 16px; right: 16px; transform: scaleX(-1); }

    /* 헤더 메타 영역 */
    .sheet-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 2.5px dashed var(--accent-pink);
      margin-bottom: 22px;
    }

    .sheet-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-badge {
      background: var(--accent-pink);
      color: white;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      padding: 5px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(255, 181, 194, 0.4);
    }

    .sheet-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.55rem;
      color: #6C5980;
    }

    .sheet-info-fields {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 1.05rem;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.8);
      padding: 4px 12px;
      border-radius: 16px;
      border: 1px solid var(--box-border);
    }

    .info-line {
      display: inline-block;
      width: 70px;
      border-bottom: 2px solid var(--accent-pink);
      height: 16px;
    }

    /* ========================================================
       한 페이지 9문제 3줄 배치 (3열 x 3행)
       아이들이 직접 손으로 풀이 과정을 적을 수 있는 넉넉한 공간 확보
       ======================================================== */
    .problems-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, auto);
      gap: 28px 24px; /* 문제 카드 사이 간격 넓게 확장 */
      margin-bottom: 20px;
    }

    /* 개별 문제 카드: 풀이 여백과 메모 공간 충분히 제공 */
    .problem-card {
      background: white;
      border-radius: 26px;
      padding: 20px 16px 18px;
      box-shadow: 0 4px 14px rgba(210, 190, 210, 0.14);
      border: 2px solid #F6EAF0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 295px; /* 세로 높이를 넉넉히 주어 풀이 공간 확보 */
      transition: all 0.2s ease;
    }

    .problem-card:hover {
      border-color: var(--accent-pink);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 181, 194, 0.25);
    }

    .problem-number {
      position: absolute;
      top: 12px;
      left: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.1rem;
      color: #7B6B8D;
      background: var(--accent-blue-soft);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid #D5E7FA;
    }

    .problem-helper-tag {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 0.8rem;
      color: #9D88B0;
      background: #FDF4F6;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #FBE3E9;
    }

    /* 세로셈 수식 영역 */
    .vertical-math {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 156px;
      margin-top: 18px;
      font-family: 'Gowun Dodum', sans-serif;
    }

    .math-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      height: 40px;
      font-size: 2rem;
      font-weight: bold;
      color: #5D4B72;
      letter-spacing: 9px;
      padding-right: 4px;
    }

    .math-row.operator-row {
      position: relative;
      display: flex;
      justify-content: space-between;
    }

    .operator-symbol {
      font-size: 1.7rem;
      color: var(--accent-pink);
      font-weight: 900;
      margin-left: 2px;
    }

    .divider-line {
      width: 100%;
      height: 2.8px;
      background-color: #7B6B8D;
      border-radius: 2px;
      margin: 4px 0 8px;
    }

    .sub-divider-line {
      width: 100%;
      height: 2px;
      background-color: #B2A4BF;
      border-radius: 2px;
      margin: 8px 0 8px;
    }

    /* 세로셈 단계별 빈칸 (두 칸 및 세 칸) */
    .step-row {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      width: 100%;
      margin-bottom: 6px;
      position: relative;
    }

    .step-explain {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.74rem;
      color: #A999B8;
      white-space: nowrap;
    }

    /* 솜사탕/구름 네모 박스 (□□) */
    .box-input {
      width: 34px;
      height: 36px;
      border: 2px solid var(--box-border);
      border-radius: 10px;
      background: #FAFAFC;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #554469;
      font-family: 'Gowun Dodum', sans-serif;
      outline: none;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
    }

    .box-input::-webkit-outer-spin-button,
    .box-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .box-input:focus {
      border-color: #FF8EA3;
      background: #FFF8FA;
      box-shadow: 0 0 0 3px rgba(255, 181, 194, 0.35);
      transform: scale(1.05);
    }

    .box-input.correct {
      border-color: #4CAF50;
      background: #E8F5E9;
      color: #2E7D32;
    }

    .box-input.incorrect {
      border-color: #FF5252;
      background: #FFEBEE;
      color: #C62828;
    }

    /* 최종 결과 박스 강조 */
    .final-row .box-input {
      border-color: #C8BED2;
      background: #FCFAFF;
      height: 38px;
    }
    .final-row .box-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(181, 216, 247, 0.4);
    }

    /* 문제 카드 하단 아이 손글씨 풀이/메모 공간 */
    .scratchpad-hint {
      margin-top: 10px;
      width: 100%;
      border-top: 1px dotted #ECDDE5;
      padding-top: 5px;
      text-align: center;
      font-size: 0.72rem;
      color: #C2B3CD;
      user-select: none;
    }

    /* 페이지 하단 푸터 장식 */
    .sheet-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1.5px solid #F1E5EC;
      font-size: 0.95rem;
      color: #A594B5;
    }

    .footer-mascot {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-mascot svg {
      width: 24px;
      height: 24px;
    }

    /* 정답지 모드 스타일 */
    .answer-key-view {
      display: none;
    }
    .answer-key-view.active {
      display: block;
    }
    .worksheet-view {
      display: flex;
    }
    .worksheet-view.hidden {
      display: none;
    }

    .answer-key-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .answer-page-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 3px 12px rgba(180, 160, 200, 0.12);
      border: 2px solid var(--accent-blue-soft);
    }

    .answer-page-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #456E94;
      padding-bottom: 8px;
      border-bottom: 1.5px dashed #B5D8F7;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .answer-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
    }

    .answer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FBFE;
      padding: 6px 10px;
      border-radius: 12px;
    }

    .answer-calc {
      font-weight: bold;
      color: #6C5980;
    }

    .answer-steps {
      font-size: 0.85rem;
      color: #3B729E;
      background: #E5F1FC;
      padding: 2px 8px;
      border-radius: 8px;
    }

    /* 점수 배너 */
    .score-banner {
      background: linear-gradient(135deg, #FFE4E8, #E5F1FC);
      border-radius: 18px;
      padding: 12px 20px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      border: 2px solid white;
      box-shadow: 0 4px 12px rgba(220, 190, 210, 0.2);
      max-width: 820px;
      width: 100%;
    }

    .score-banner.show {
      display: flex;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ========================================================
       인쇄(Print) 전용 CSS - 엄격한 A4 규격 적용
       ======================================================== */
    @page {
      size: A4 portrait;
      margin: 10mm 12mm 10mm 12mm;
    }

    @media print {
      body {
        background: white !important;
        background-image: none !important;
        padding: 0 !important;
        color: #333 !important;
        display: block !important;
      }

      .app-header, .controls-panel, .score-banner, .footer-btns, .download-overlay {
        display: none !important;
      }

      .worksheet-container {
        box-shadow: none !important;
        border: 2px solid #E5D5DE !important;
        max-width: 100% !important;
        width: 100% !important;
        min-height: 275mm !important;
        height: auto !important;
        page-break-after: always !important;
        break-after: page !important;
        padding: 12mm 14mm 10mm !important;
        border-radius: 12mm !important;
        background: white !important;
        margin: 0 auto !important;
      }

      .all-print-pages {
        display: block !important;
      }

      .worksheet-view, .answer-key-view {
        display: none !important;
      }

      .problems-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 22px 18px !important;
      }

      .problem-card {
        border: 1.5px solid #E8DCE4 !important;
        box-shadow: none !important;
        break-inside: avoid !important;
        min-height: 270px !important;
      }

      .box-input {
        border: 1.8px solid #9A89A6 !important;
        background: white !important;
        color: #333 !important;
      }

      .answer-key-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 14px !important;
      }

      .answer-page-card {
        border: 1.5px solid #CCDDEE !important;
        box-shadow: none !important;
        break-inside: avoid !important;
      }
    }

    .all-print-pages {
      display: none;
      width: 100%;
      max-width: 820px;
    }

    /* 화면 폭이 좁은 모바일 화면 대응 */
    @media (max-width: 768px) {
      .problems-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .answer-key-grid {
        grid-template-columns: 1fr;
      }
      .worksheet-container {
        padding: 24px 16px;
        border-radius: 24px;
        min-height: auto;
      }
      h1 { font-size: 1.7rem; }
      .math-row { font-size: 1.7rem; }
      .box-input { width: 30px; height: 32px; font-size: 1.3rem; }
      .vertical-math { width: 140px; }
    }
  </style>
</head>
<body>

  <!-- 다운로드 진행 로딩 오버레이 -->
  <div class="download-overlay" id="downloadOverlay">
    <div class="download-spinner"></div>
    <div style="font-size: 1.3rem;" id="downloadStatusText">A4 고화질 파일 생성 중...</div>
    <div style="font-size: 0.95rem; opacity: 0.85;">잠시만 기다려주세요 🌸</div>
  </div>

  <!-- 동화풍 상단 헤더 -->
  <header class="app-header">
    <div class="deco-elements">
      <!-- 몽실몽실 구름 SVG -->
      <svg class="cloud-icon" width="46" height="30" viewBox="0 0 64 42" fill="none">
        <path d="M18 38C10 38 4 32 4 24C4 17 9 12 16 11C18 5 24 1 31 1C39 1 45 6 47 13C52 13 58 17 58 23C58 29 53 35 46 36L46 38" fill="#B5D8F7" fill-opacity="0.6"/>
        <path d="M22 36C15 36 10 31 10 24C10 18 14 13.5 20 12.5C22 7.5 27 4 33 4C40 4 45.5 8.5 47 14.5C51 14.5 55 18 55 23C55 28.5 50.5 34 44 35" fill="#FFFFFF"/>
        <circle cx="27" cy="22" r="2" fill="#7B6B8D"/>
        <circle cx="37" cy="22" r="2" fill="#7B6B8D"/>
        <path d="M30 26Q32 28 34 26" stroke="#FFB5C2" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <!-- 반짝 별 SVG -->
      <svg class="star-icon" width="28" height="28" viewBox="0 0 24 24" fill="none">

  <!-- 인쇄 전용 5페이지 묶음 컨테이너 (인쇄 시 자동 반영) -->
  <div class="all-print-pages" id="allPrintPages">
    <!-- 자바스크립트로 5페이지 + 정답지 전부 생성 -->
  </div>

  <script>
    // 5페이지, 각 페이지당 9문제 (총 45문제)
    const pageProblemTemplates = [
      // Page 1: 10대 수 곱셈 기초 (예: 19 x 3 포함)
      [
        { num1: 19, num2: 3 },
        { num1: 14, num2: 2 },
        { num1: 16, num2: 4 },
        { num1: 12, num2: 5 },
        { num1: 18, num2: 3 },
        { num1: 13, num2: 4 },
        { num1: 15, num2: 3 },
        { num1: 17, num2: 2 },
        { num1: 19, num2: 4 }
      ],
      // Page 2: 20대 수 곱셈 연습
      [
        { num1: 23, num2: 3 },
        { num1: 26, num2: 2 },
        { num1: 24, num2: 4 },
        { num1: 21, num2: 5 },
        { num1: 27, num2: 3 },
        { num1: 25, num2: 4 },
        { num1: 28, num2: 2 },
        { num1: 22, num2: 6 },
        { num1: 29, num2: 3 }
      ],
      // Page 3: 30~40대 수 곱셈 (받아올림 기본)
      [
        { num1: 32, num2: 4 },
        { num1: 35, num2: 3 },
        { num1: 43, num2: 2 },
        { num1: 38, num2: 3 },
        { num1: 46, num2: 2 },
        { num1: 34, num2: 5 },
        { num1: 48, num2: 3 },
        { num1: 37, num2: 4 },
        { num1: 45, num2: 4 }
      ],
      // Page 4: 50~60대 수 곱셈 실력 다지기
      [
        { num1: 52, num2: 4 },
        { num1: 56, num2: 3 },
        { num1: 64, num2: 3 },
        { num1: 58, num2: 2 },
        { num1: 63, num2: 4 },
        { num1: 57, num2: 5 },
        { num1: 68, num2: 3 },
        { num1: 54, num2: 6 },
        { num1: 65, num2: 4 }
      ],
      // Page 5: 종합 두 자릿수 곱셈 모험
      [
        { num1: 72, num2: 4 },
        { num1: 75, num2: 3 },
        { num1: 83, num2: 3 },
        { num1: 76, num2: 5 },
        { num1: 84, num2: 4 },
        { num1: 89, num2: 2 },
        { num1: 92, num2: 4 },
        { num1: 95, num2: 3 },
        { num1: 88, num2: 6 }
      ]
    ];

    let allPagesData = JSON.parse(JSON.stringify(pageProblemTemplates));
    let currentPage = 1;
    let userInputs = {};

    function initUserInputs() {
      for (let p = 0; p < 5; p++) {
        userInputs[p] = {};
        for (let i = 0; i < 9; i++) {
          userInputs[p][i] = {
            step1: ['', ''],
            step2: ['', ''],
            final: ['', '', '']
          };
        }
      }
    }
    initUserInputs();

    function calculateSteps(num1, num2) {
      const tens = Math.floor(num1 / 10);
      const ones = num1 % 10;
      
      const step1Val = ones * num2;       // 일의 자리 x 곱하는 수 (예: 9 x 3 = 27)
      const step2Val = tens * num2 * 10;  // 십의 자리 x 곱하는 수 (예: 10 x 3 = 30)
      const finalVal = num1 * num2;       // 합계 (예: 57)

      const step1Str = step1Val.toString().padStart(2, '0');
      const step2Str = step2Val.toString().padStart(2, '0');
      const finalStr = finalVal.toString().padStart(3, '0');

      return {
        ones,
        tens,
        step1Val,
        step2Val,
        finalVal,
        step1Digits: [step1Str[0], step1Str[1]],
        step2Digits: [step2Str[0], step2Str[1]],
        finalDigits: [finalStr[0], finalStr[1], finalStr[2]]
      };
    }

    const pageTitles = [
      '기초 쑥쑥! 10대 수 곱셈 🎈',
      '자신감 뿜뿜! 20대 수 곱셈 🐰',
      '원리 쏙쏙! 30~40대 수 곱셈 ☁️',
      '실력 탄탄! 50~60대 수 곱셈 🌟',
      '곱셈 왕 도전! 종합 세로셈 모험 👑'
    ];

    function renderWorksheet(pageNumber) {
      const pageIndex = pageNumber - 1;
      const problems = allPagesData[pageIndex];
      const grid = document.getElementById('problemsGrid');
      grid.innerHTML = '';

      document.getElementById('sheetBadge').innerText = `제 ${pageNumber} 쪽`;
      document.getElementById('footerPageNumber').innerText = `${pageNumber} / 5 쪽`;
      document.getElementById('sheetTitleText').innerText = pageTitles[pageIndex];

      problems.forEach((prob, idx) => {
        const steps = calculateSteps(prob.num1, prob.num2);
        const card = document.createElement('div');
        card.className = 'problem-card';
        card.id = `problem-card-${idx}`;

        const savedInput = userInputs[pageIndex][idx];

        card.innerHTML = `
          <div class="problem-number">${idx + 1}</div>
          <div class="problem-helper-tag">${prob.num1} × ${prob.num2}</div>
          
          <div class="vertical-math">
            <!-- 윗 수 (두 자릿수) -->
            <div class="math-row">
              <span>${prob.num1}</span>
            </div>

            <!-- 아랫 수 (한 자릿수) + X 기호 -->
            <div class="math-row operator-row">
              <span class="operator-symbol">×</span>
              <span>${prob.num2}</span>
            </div>

            <!-- 첫 번째 구분선 ---- -->
            <div class="divider-line"></div>

            <!-- 1단계: 일의 자리 곱 (예: 9 x 3 = 27) □□ -->
            <div class="step-row">
              <span class="step-explain">${steps.ones}×${prob.num2}</span>
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s1-0" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s1" data-digit="0"
                value="${savedInput.step1[0]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s1-1" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s1" data-digit="1"
                value="${savedInput.step1[1]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
            </div>

            <!-- 2단계: 십의 자리 곱 (예: 10 x 3 = 30) □□ -->
            <div class="step-row">
              <span class="step-explain">${steps.tens * 10}×${prob.num2}</span>
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s2-0" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s2" data-digit="0"
                value="${savedInput.step2[0]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s2-1" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s2" data-digit="1"
                value="${savedInput.step2[1]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
            </div>

            <!-- 두 번째 구분선 ---- -->
            <div class="sub-divider-line"></div>

            <!-- 3단계 최종 합산: □□□ -->
            <div class="step-row final-row">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-f-0" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="f" data-digit="0"
                value="${savedInput.final[0]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-f-1" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="f" data-digit="1"
                value="${savedInput.final[1]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-f-2" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="f" data-digit="2"
                value="${savedInput.final[2]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
            </div>
          </div>
          <div class="scratchpad-hint">✏️ 풀이 공간</div>
        `;

        grid.appendChild(card);
      });
    }

    function handleInputMove(input) {
      const val = input.value.trim();
      const page = parseInt(input.dataset.page);
      const prob = parseInt(input.dataset.prob);
      const stage = input.dataset.stage;
      const digit = parseInt(input.dataset.digit);

      if (!/^\d*$/.test(val)) {
        input.value = '';
        return;
      }

      if (stage === 's1') userInputs[page][prob].step1[digit] = val;
      if (stage === 's2') userInputs[page][prob].step2[digit] = val;
      if (stage === 'f') userInputs[page][prob].final[digit] = val;

      if (val.length === 1) {
        const inputsInCard = Array.from(input.closest('.problem-card').querySelectorAll('.box-input'));
        const currIdx = inputsInCard.indexOf(input);
        if (currIdx >= 0 && currIdx < inputsInCard.length - 1) {
          inputsInCard[currIdx + 1].focus();
        }
      }
    }

    function handleKeyDown(e, input) {
      if (e.key === 'Backspace' && input.value === '') {
        const inputsInCard = Array.from(input.closest('.problem-card').querySelectorAll('.box-input'));
        const currIdx = inputsInCard.indexOf(input);
        if (currIdx > 0) {
          inputsInCard[currIdx - 1].focus();
        }
      }
    }

    function switchPage(page) {
      const tabs = document.querySelectorAll('#pageTabGroup .tab-btn');
      tabs.forEach(t => t.classList.remove('active'));

      const worksheetView = document.getElementById('worksheetView');
      const answerKeyView = document.getElementById('answerKeyView');

      if (page === 'answer') {
        worksheetView.classList.add('hidden');
        answerKeyView.classList.add('active');
        tabs[5].classList.add('active');
        renderAnswerKey();
      } else {
        currentPage = page;
        worksheetView.classList.remove('hidden');
        answerKeyView.classList.remove('active');
        tabs[page - 1].classList.add('active');
        renderWorksheet(currentPage);
      }
      closeScoreBanner();
    }

    function checkAnswers() {
      if (currentPage === 'answer') return;

      const pageIndex = currentPage - 1;
      const problems = allPagesData[pageIndex];
      let correctProblemCount = 0;

      problems.forEach((prob, idx) => {
        const steps = calculateSteps(prob.num1, prob.num2);
        let isProblemFullyCorrect = true;

        const s1_0 = document.getElementById(`p${pageIndex}-prob${idx}-s1-0`);
        const s1_1 = document.getElementById(`p${pageIndex}-prob${idx}-s1-1`);
        const s1User = (s1_0.value + s1_1.value).trim();
        const s1Correct = (parseInt(s1User) === steps.step1Val);

        validateInputBox(s1_0, s1Correct);
        validateInputBox(s1_1, s1Correct);
        if (!s1Correct) isProblemFullyCorrect = false;

        const s2_0 = document.getElementById(`p${pageIndex}-prob${idx}-s2-0`);
        const s2_1 = document.getElementById(`p${pageIndex}-prob${idx}-s2-1`);
        const s2User = (s2_0.value + s2_1.value).trim();
        const s2Correct = (parseInt(s2User) === steps.step2Val);

        validateInputBox(s2_0, s2Correct);
        validateInputBox(s2_1, s2Correct);
        if (!s2Correct) isProblemFullyCorrect = false;

        const f_0 = document.getElementById(`p${pageIndex}-prob${idx}-f-0`);
        const f_1 = document.getElementById(`p${pageIndex}-prob${idx}-f-1`);
        const f_2 = document.getElementById(`p${pageIndex}-prob${idx}-f-2`);
        const fUser = (f_0.value + f_1.value + f_2.value).trim();
        const fCorrect = (parseInt(fUser) === steps.finalVal);

        validateInputBox(f_0, fCorrect);
        validateInputBox(f_1, fCorrect);
        validateInputBox(f_2, fCorrect);
        if (!fCorrect) isProblemFullyCorrect = false;

        if (isProblemFullyCorrect) {
          correctProblemCount++;
        }
      });

      document.getElementById('sheetScoreDisplay').innerText = `${correctProblemCount} / 9`;

      const banner = document.getElementById('scoreBanner');
      const scoreIcon = document.getElementById('scoreIcon');
      const scoreTitle = document.getElementById('scoreTitle');
      const scoreMessage = document.getElementById('scoreMessage');

      banner.classList.add('show');
      if (correctProblemCount === 9) {
        scoreIcon.innerText = '🌸';
        scoreTitle.innerText = '와아, 100점 만점이에요!';
        scoreMessage.innerText = '9문제를 모두 완벽하게 맞혔어요! 솜사탕처럼 달콤한 곱셈 박사님!';
      } else if (correctProblemCount >= 6) {
        scoreIcon.innerText = '⭐';
        scoreTitle.innerText = '참 잘했어요!';
        scoreMessage.innerText = `9문제 중 ${correctProblemCount}문제를 맞혔어요. 틀린 문제도 조금만 다시 생각해보면 맞힐 수 있어요!`;
      } else {
        scoreIcon.innerText = '🧸';
        scoreTitle.innerText = '차근차근 다시 해보아요!';
        scoreMessage.innerText = `9문제 중 ${correctProblemCount}문제를 맞혔어요. 일의 자리와 십의 자리를 나누어 곱해보세요.`;
      }
    }

    function validateInputBox(input, isCorrect) {
      if (!input) return;
      input.classList.remove('correct', 'incorrect');
      if (input.value.trim() !== '') {
        input.classList.add(isCorrect ? 'correct' : 'incorrect');
      } else {
        if (!isCorrect) input.classList.add('incorrect');
      }
    }

    function closeScoreBanner() {
      document.getElementById('scoreBanner').classList.remove('show');
    }

    function resetCurrentPage() {
      const pageIndex = currentPage - 1;
      for (let i = 0; i < 9; i++) {
        userInputs[pageIndex][i] = {
          step1: ['', ''],
          step2: ['', ''],
          final: ['', '', '']
        };
      }
      document.getElementById('sheetScoreDisplay').innerText = ` / 9`;
      renderWorksheet(currentPage);
      closeScoreBanner();
    }

    function generateNewNumbers() {
      const pageIndex = currentPage - 1;
      const newProbs = [];
      for (let i = 0; i < 9; i++) {
        let num1, num2;
        if (pageIndex === 0) {
          num1 = Math.floor(Math.random() * 10) + 10; // 10~19
          num2 = Math.floor(Math.random() * 4) + 2;  // 2~5
        } else if (pageIndex === 1) {
          num1 = Math.floor(Math.random() * 10) + 20; // 20~29
          num2 = Math.floor(Math.random() * 4) + 2;
        } else if (pageIndex === 2) {
          num1 = Math.floor(Math.random() * 20) + 30; // 30~49
          num2 = Math.floor(Math.random() * 4) + 2;
        } else if (pageIndex === 3) {
          num1 = Math.floor(Math.random() * 20) + 50; // 50~69
          num2 = Math.floor(Math.random() * 5) + 2;
        } else {
          num1 = Math.floor(Math.random() * 30) + 70; // 70~99
          num2 = Math.floor(Math.random() * 6) + 2;
        }
        newProbs.push({ num1, num2 });
      }
      allPagesData[pageIndex] = newProbs;
      resetCurrentPage();
      buildAllPrintPages();
    }

    function renderAnswerKey() {
      const grid = document.getElementById('answerKeyGrid');
      grid.innerHTML = '';

      allPagesData.forEach((probs, pIdx) => {
        const card = document.createElement('div');
        card.className = 'answer-page-card';
        card.innerHTML = `
          <div class="answer-page-title">
            <span>🌸</span> 제 ${pIdx + 1} 쪽 정답표
          </div>
          <ul class="answer-list">
            ${probs.map((p, i) => {
              const steps = calculateSteps(p.num1, p.num2);
              return `
                <li class="answer-item">
                  <span class="answer-calc"><strong>${i + 1}번:</strong> ${p.num1} × ${p.num2} = <strong>${steps.finalVal}</strong></span>
                  <span class="answer-steps">(${steps.step1Val} + ${steps.step2Val})</span>
                </li>
              `;
            }).join('')}
          </ul>
        `;
        grid.appendChild(card);
      });
    }

    // ========================================================
    // A4 규격 파일 다운로드 엔진 (PDF 및 PNG)
    // ========================================================
    async function downloadWorksheet(format) {
      const overlay = document.getElementById('downloadOverlay');
      const statusText = document.getElementById('downloadStatusText');
      overlay.classList.add('show');
      statusText.innerText = `A4 ${format.toUpperCase()} 파일 렌더링 중...`;

      try {
        const targetEl = (currentPage === 'answer') 
          ? document.getElementById('answerKeyView')
          : document.getElementById('worksheetView');

        // html2canvas 고해상도 렌더링 (scale: 2)
        const canvas = await html2canvas(targetEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#FFF5F5',
          logging: false
        });

        const pageLabel = (currentPage === 'answer') ? '정답지' : `${currentPage}쪽`;
        const fileName = `초등2학년_세로셈곱셈_${pageLabel}`;

        if (format === 'png') {
          // PNG 다운로드
          const link = document.createElement('a');
          link.download = `${fileName}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else if (format === 'pdf') {
          // A4 규격 jsPDF 생성 (210mm x 297mm)
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          const imgData = canvas.toDataURL('image/png');
          const pdfWidth = 210;
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

          // 페이지 중앙 배치
          const marginY = (297 > pdfHeight) ? (297 - pdfHeight) / 2 : 0;
          pdf.addImage(imgData, 'PNG', 0, marginY, pdfWidth, pdfHeight, undefined, 'FAST');
          pdf.save(`${fileName}.pdf`);
        }
      } catch (err) {
        alert('다운로드 중 오류가 발생했습니다. 브라우저 인쇄(A4)를 이용하실 수도 있습니다.');
        console.error(err);
      } finally {
        overlay.classList.remove('show');
      }
    }

    function buildAllPrintPages() {
      const container = document.getElementById('allPrintPages');
      container.innerHTML = '';

      allPagesData.forEach((probs, pIdx) => {
        const pageEl = document.createElement('div');
        pageEl.className = 'worksheet-container';
        pageEl.innerHTML = `
          <div class="sheet-meta">
            <div class="sheet-title-box">
              <span class="sheet-badge">제 ${pIdx + 1} 쪽</span>
              <h2 class="sheet-title">${pageTitles[pIdx]}</h2>
            </div>
            <div class="sheet-info-fields">
              <div class="info-field"><span>날짜:</span> <span class="info-line"></span></div>
              <div class="info-field"><span>이름:</span> <span class="info-line"></span></div>
              <div class="info-field"><span>점수:</span> <span class="info-line"></span></div>
            </div>
          </div>
          <div class="problems-grid">
            ${probs.map((prob, idx) => {
              const steps = calculateSteps(prob.num1, prob.num2);
              return `
                <div class="problem-card">
                  <div class="problem-number">${idx + 1}</div>
                  <div class="problem-helper-tag">${prob.num1} × ${prob.num2}</div>
                  <div class="vertical-math">
                    <div class="math-row"><span>${prob.num1}</span></div>
                    <div class="math-row operator-row">
                      <span class="operator-symbol">×</span>
                      <span>${prob.num2}</span>
                    </div>
                    <div class="divider-line"></div>
                    <div class="step-row">
                      <span class="step-explain">${steps.ones}×${prob.num2}</span>
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                    </div>
                    <div class="step-row">
                      <span class="step-explain">${steps.tens * 10}×${prob.num2}</span>
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                    </div>
                    <div class="sub-divider-line"></div>
                    <div class="step-row final-row">
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                    </div>
                  </div>
                  <div class="scratchpad-hint">✏️ 풀이 공간</div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="sheet-footer">
            <span>초등학교 2학년 곱셈 구구 및 세로셈 단계별 익히기</span>
            <span>${pIdx + 1} / 5 쪽</span>
          </div>
        `;
        container.appendChild(pageEl);
      });

      // 정답지 인쇄 페이지
      const ansPage = document.createElement('div');
      ansPage.className = 'worksheet-container';
      ansPage.innerHTML = `
        <div class="sheet-meta">
          <div class="sheet-title-box">
            <span class="sheet-badge" style="background:#407BB5;">정답 및 해설</span>
            <h2 class="sheet-title">전체 정답표 (1~5쪽)</h2>
          </div>
        </div>
        <div class="answer-key-grid">
          ${allPagesData.map((probs, pIdx) => `
            <div class="answer-page-card">
              <div class="answer-page-title">제 ${pIdx + 1} 쪽 정답</div>
              <ul class="answer-list">
                ${probs.map((p, i) => {
                  const steps = calculateSteps(p.num1, p.num2);
                  return `
                    <li class="answer-item">
                      <span>${i + 1}번: ${p.num1}×${p.num2} = <strong>${steps.finalVal}</strong></span>
                      <span>(${steps.step1Val}+${steps.step2Val})</span>
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(ansPage);
    }

    renderWorksheet(1);
    buildAllPrintPages();
  </script>
</body>
</html>
