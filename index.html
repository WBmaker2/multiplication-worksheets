<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>몽실몽실 초등 2학년 두 자릿수 곱셈 연습장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFF5F5;
      --text-color: #7B6B8D;
      --accent-pink: #FFB5C2;
      --accent-pink-soft: #FFE4E8;
      --accent-blue: #B5D8F7;
      --accent-blue-soft: #E5F1FC;
      --card-bg: rgba(255, 255, 255, 0.88);
      --box-border: #D8CCE0;
      --correct-color: #64B5F6;
      --shadow-soft: 0 10px 25px rgba(220, 190, 205, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Gowun Dodum', 'Gaegu', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 181, 194, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 90% 15%, rgba(181, 216, 247, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 50% 85%, rgba(255, 228, 232, 0.3) 0%, transparent 40%);
      background-attachment: fixed;
      padding: 24px 16px 40px;
    }

    /* 상단 장식 헤더 및 툴바 */
    .app-header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .deco-elements {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .cloud-icon, .star-icon, .balloon-icon {
      animation: floatSlow 4s ease-in-out infinite alternate;
    }
    .star-icon { animation-delay: 1s; }
    .balloon-icon { animation-delay: 2s; }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-7px) rotate(3deg); }
    }

    h1 {
      font-family: 'Jua', 'Gaegu', sans-serif;
      font-size: 2.2rem;
      color: #6C5980;
      text-shadow: 2px 2px 0px #FFE4E8;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #9887A8;
      margin-bottom: 16px;
    }

    /* 탭 컨트롤러 & 모드 전환 버튼 */
    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 40px;
      box-shadow: 0 4px 15px rgba(220, 190, 205, 0.2);
      border: 2px solid white;
      margin-bottom: 24px;
    }

    .page-tabs {
      display: flex;
      gap: 6px;
      background: var(--accent-pink-soft);
      padding: 4px;
      border-radius: 30px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .tab-btn.active {
      background: white;
      color: #E25B77;
      box-shadow: 0 2px 8px rgba(226, 91, 119, 0.2);
      transform: scale(1.05);
    }

    .tab-btn.answer-tab {
      background: #E8F2FC;
      color: #407BB5;
    }
    .tab-btn.answer-tab.active {
      background: #407BB5;
      color: white;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: white;
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 24px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(180, 160, 190, 0.15);
      border: 1.5px solid var(--accent-blue);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--accent-blue-soft);
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #FFB5C2, #FFA8B8);
      color: white;
      border: none;
      box-shadow: 0 3px 10px rgba(255, 181, 194, 0.4);
    }

    .action-btn.primary:hover {
      background: linear-gradient(135deg, #FF9FAA, #FF8F9E);
    }

    /* 학습지 페이지 컨테이너 (인쇄 규격 A4 비율 고려) */
    .worksheet-container {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border-radius: 36px;
      padding: 36px 36px 32px;
      box-shadow: var(--shadow-soft);
      border: 3px solid rgba(255, 255, 255, 0.95);
      position: relative;
      margin-bottom: 30px;
      backdrop-filter: blur(12px);
    }

    /* 동화 모티브 테두리 코너 장식 */
    .corner-deco {
      position: absolute;
      width: 44px;
      height: 44px;
      pointer-events: none;
      opacity: 0.85;
    }
    .corner-tl { top: 16px; left: 16px; }
    .corner-tr { top: 16px; right: 16px; transform: scaleX(-1); }

    /* 학습지 상단 헤더 (이름, 날짜, 점수 영역) */
    .sheet-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 2.5px dashed var(--accent-pink);
      margin-bottom: 26px;
    }

    .sheet-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-badge {
      background: var(--accent-pink);
      color: white;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      padding: 5px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(255, 181, 194, 0.4);
    }

    .sheet-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.55rem;
      color: #6C5980;
    }

    .sheet-info-fields {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 1.05rem;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.8);
      padding: 4px 12px;
      border-radius: 16px;
      border: 1px solid var(--box-border);
    }

    .info-line {
      display: inline-block;
      width: 70px;
      border-bottom: 2px solid var(--accent-pink);
      height: 16px;
    }

    /* 9문제 3x3 그리드 레이아웃 */
    .problems-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px 20px;
    }

    /* 개별 문제 카드 */
    .problem-card {
      background: white;
      border-radius: 24px;
      padding: 18px 16px 16px;
      box-shadow: 0 4px 14px rgba(210, 190, 210, 0.15);
      border: 2px solid #F6EAF0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    .problem-card:hover {
      border-color: var(--accent-pink);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 181, 194, 0.25);
    }

    .problem-number {
      position: absolute;
      top: 10px;
      left: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      color: #9C89AD;
      background: var(--accent-blue-soft);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .problem-helper-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.75rem;
      color: #A490B6;
      background: #FDF4F6;
      padding: 2px 7px;
      border-radius: 10px;
    }

    /* 세로 셈 수식 컨테이너 */
    .vertical-math {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 145px;
      margin-top: 14px;
      font-family: 'Gowun Dodum', sans-serif;
    }

    .math-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      height: 38px;
      font-size: 1.9rem;
      font-weight: bold;
      color: #5D4B72;
      letter-spacing: 7px;
      padding-right: 4px;
    }

    .math-row.operator-row {
      position: relative;
      display: flex;
      justify-content: space-between;
    }

    .operator-symbol {
      font-size: 1.6rem;
      color: var(--accent-pink);
      font-weight: 900;
      margin-left: 2px;
    }

    .divider-line {
      width: 100%;
      height: 2.5px;
      background-color: #7B6B8D;
      border-radius: 2px;
      margin: 4px 0 6px;
    }

    .sub-divider-line {
      width: 100%;
      height: 2px;
      background-color: #B2A4BF;
      border-radius: 2px;
      margin: 6px 0;
    }

    /* 세로셈 단계별 빈칸 (두 칸 및 세 칸) */
    .step-row {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      width: 100%;
      margin-bottom: 5px;
      position: relative;
    }

    .step-explain {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.72rem;
      color: #A999B8;
      white-space: nowrap;
    }

    /* 솜사탕/구름 네모 박스 (□□) */
    .box-input {
      width: 32px;
      height: 34px;
      border: 2px solid var(--box-border);
      border-radius: 9px;
      background: #FAFAFC;
      text-align: center;
      font-size: 1.45rem;
      font-weight: bold;
      color: #554469;
      font-family: 'Gowun Dodum', sans-serif;
      outline: none;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
    }

    .box-input::-webkit-outer-spin-button,
    .box-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .box-input:focus {
      border-color: #FF8EA3;
      background: #FFF8FA;
      box-shadow: 0 0 0 3px rgba(255, 181, 194, 0.35);
      transform: scale(1.05);
    }

    .box-input.correct {
      border-color: #4CAF50;
      background: #E8F5E9;
      color: #2E7D32;
    }

    .box-input.incorrect {
      border-color: #FF5252;
      background: #FFEBEE;
      color: #C62828;
    }

    .box-input.empty-guide {
      background: #FAF8FC;
    }

    /* 최종 결과 박스 강조 */
    .final-row .box-input {
      border-color: #C8BED2;
      background: #FCFAFF;
      height: 36px;
    }
    .final-row .box-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(181, 216, 247, 0.4);
    }

    /* 페이지 하단 푸터 장식 */
    .sheet-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1.5px solid #F1E5EC;
      font-size: 0.95rem;
      color: #A594B5;
    }

    .footer-mascot {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-mascot svg {
      width: 24px;
      height: 24px;
    }

    /* 답지 모드 스타일 */
    .answer-key-view {
      display: none;
    }
    .answer-key-view.active {
      display: block;
    }
    .worksheet-view {
      display: block;
    }
    .worksheet-view.hidden {
      display: none;
    }

    .answer-key-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .answer-page-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 3px 12px rgba(180, 160, 200, 0.12);
      border: 2px solid var(--accent-blue-soft);
    }

    .answer-page-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #456E94;
      padding-bottom: 8px;
      border-bottom: 1.5px dashed #B5D8F7;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .answer-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
    }

    .answer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FBFE;
      padding: 6px 10px;
      border-radius: 12px;
    }

    .answer-calc {
      font-weight: bold;
      color: #6C5980;
    }

    .answer-steps {
      font-size: 0.85rem;
      color: #3B729E;
      background: #E5F1FC;
      padding: 2px 8px;
      border-radius: 8px;
    }

    /* 플로팅 피드백 모달 / 토스트 */
    .score-banner {
      background: linear-gradient(135deg, #FFE4E8, #E5F1FC);
      border-radius: 18px;
      padding: 12px 20px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      border: 2px solid white;
      box-shadow: 0 4px 12px rgba(220, 190, 210, 0.2);
    }

    .score-banner.show {
      display: flex;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 인쇄 최적화 (Print CSS) */
    @media print {
      body {
        background: white !important;
        background-image: none !important;
        padding: 0 !important;
        color: #333 !important;
      }

      .app-header, .controls-panel, .score-banner, .footer-btns {
        display: none !important;
      }

      .worksheet-container {
        box-shadow: none !important;
        border: 1px solid #CCC !important;
        max-width: 100% !important;
        width: 100% !important;
        page-break-after: always;
        padding: 20mm 15mm !important;
        border-radius: 0 !important;
        background: white !important;
      }

      .all-print-pages {
        display: block !important;
      }

      .worksheet-view, .answer-key-view {
        display: none !important;
      }

      .problem-card {
        border: 1.5px solid #DDD !important;
        box-shadow: none !important;
        break-inside: avoid;
      }

      .box-input {
        border: 1.5px solid #999 !important;
        background: white !important;
        color: #333 !important;
      }

      .page-break {
        page-break-after: always;
      }
    }

    .all-print-pages {
      display: none;
      width: 100%;
      max-width: 860px;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 768px) {
      .problems-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .answer-key-grid {
        grid-template-columns: 1fr;
      }
      .worksheet-container {
        padding: 24px 16px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .math-row {
        font-size: 1.6rem;
      }
      .box-input {
        width: 28px;
        height: 30px;
        font-size: 1.25rem;
      }
      .vertical-math {
        width: 130px;
      }
    }
  </style>
</head>
<body>

  <!-- 동화풍 상단 헤더 -->
  <header class="app-header">
    <div class="deco-elements">
      <!-- 몽실몽실 구름 SVG -->
      <svg class="cloud-icon" width="46" height="30" viewBox="0 0 64 42" fill="none">
        <path d="M18 38C10 38 4 32 4 24C4 17 9 12 16 11C18 5 24 1 31 1C39 1 45 6 47 13C52 13 58 17 58 23C58 29 53 35 46 36L46 38" fill="#B5D8F7" fill-opacity="0.6"/>
        <path d="M22 36C15 36 10 31 10 24C10 18 14 13.5 20 12.5C22 7.5 27 4 33 4C40 4 45.5 8.5 47 14.5C51 14.5 55 18 55 23C55 28.5 50.5 34 44 35" fill="#FFFFFF"/>
        <circle cx="27" cy="22" r="2" fill="#7B6B8D"/>
        <circle cx="37" cy="22" r="2" fill="#7B6B8D"/>
        <path d="M30 26Q32 28 34 26" stroke="#FFB5C2" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <!-- 반짝 별 SVG -->
      <svg class="star-icon" width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L14.4 8.6L21.5 9.2L16 13.8L17.7 20.8L12 17.2L6.3 20.8L8 13.8L2.5 9.2L9.6 8.6L12 2Z" fill="#FFE082"/>
      </svg>

      <!-- 토끼 요정 SVG -->
      <svg class="rabbit-icon" width="38" height="38" viewBox="0 0 40 40" fill="none">
        <ellipse cx="14" cy="12" rx="4" ry="10" fill="#FFCCD5"/>
        <ellipse cx="26" cy="12" rx="4" ry="10" fill="#FFCCD5"/>
        <ellipse cx="14" cy="12" rx="2" ry="7" fill="#FFF0F3"/>
        <ellipse cx="26" cy="12" rx="2" ry="7" fill="#FFF0F3"/>
        <circle cx="20" cy="24" r="12" fill="#FFFFFF"/>
        <circle cx="16" cy="23" r="1.8" fill="#5D4B72"/>
        <circle cx="24" cy="23" r="1.8" fill="#5D4B72"/>
        <ellipse cx="13" cy="26" rx="2.5" ry="1.5" fill="#FFB5C2" opacity="0.6"/>
        <ellipse cx="27" cy="26" rx="2.5" ry="1.5" fill="#FFB5C2" opacity="0.6"/>
        <path d="M19 26L21 26L20 27.5Z" fill="#FF8EA3"/>
        <path d="M18 29Q20 30.5 22 29" stroke="#7B6B8D" stroke-width="1.2" stroke-linecap="round"/>
      </svg>

      <!-- 아기 곰 인형 SVG -->
      <svg class="bear-icon" width="36" height="36" viewBox="0 0 40 40" fill="none">
        <circle cx="10" cy="12" r="5" fill="#E6D3C4"/>
        <circle cx="30" cy="12" r="5" fill="#E6D3C4"/>
        <circle cx="10" cy="12" r="3" fill="#FFD1DC"/>
        <circle cx="30" cy="12" r="3" fill="#FFD1DC"/>
        <circle cx="20" cy="22" r="13" fill="#EBDCD0"/>
        <ellipse cx="20" cy="25" rx="5" ry="4" fill="#FFFFFF"/>
        <circle cx="16" cy="20" r="1.6" fill="#5D4B72"/>
        <circle cx="24" cy="20" r="1.6" fill="#5D4B72"/>
        <ellipse cx="20" cy="24" rx="2" ry="1.4" fill="#7B6B8D"/>
        <path d="M19 26Q20 27.2 21 26" stroke="#7B6B8D" stroke-width="1.2" stroke-linecap="round"/>
      </svg>

      <!-- 포근한 달님 SVG -->
      <svg class="star-icon" width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M20 13C19.5 17 16 20.5 12 20.5C7.3 20.5 3.5 16.7 3.5 12C3.5 8 6.5 4.5 10.5 4C9.5 6 9 8 9 10.5C9 15 12.5 18.5 17 18.5C18.2 18.5 19.3 18.2 20 13Z" fill="#FFE599"/>
      </svg>
    </div>
    <h1>두 자릿수 × 한 자릿수 세로셈 연습장</h1>
    <p class="subtitle">☁️ 솜사탕처럼 부드럽고 차근차근 풀어나가는 곱셈 모험 (초등학교 2학년) ☁️</p>
  </header>

  <!-- 컨트롤 네비게이션 & 탭 -->
  <section class="controls-panel">
    <div class="page-tabs" id="pageTabGroup">
      <button class="tab-btn active" onclick="switchPage(1)">1쪽</button>
      <button class="tab-btn" onclick="switchPage(2)">2쪽</button>
      <button class="tab-btn" onclick="switchPage(3)">3쪽</button>
      <button class="tab-btn" onclick="switchPage(4)">4쪽</button>
      <button class="tab-btn" onclick="switchPage(5)">5쪽</button>
      <button class="tab-btn answer-tab" onclick="switchPage('answer')">📖 정답지</button>
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="action-btn primary" onclick="checkAnswers()">
        <span>✨</span> 채점하기
      </button>
      <button class="action-btn" onclick="resetCurrentPage()">
        <span>🔄</span> 다시 풀기
      </button>
      <button class="action-btn" onclick="generateNewNumbers()">
        <span>🎲</span> 새 문제 생성
      </button>
      <button class="action-btn" onclick="window.print()">
        <span>🖨️</span> 학습지 인쇄
      </button>
    </div>
  </section>

  <!-- 점수 피드백 배너 -->
  <div class="score-banner" id="scoreBanner">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.8rem;" id="scoreIcon">🎉</span>
      <div>
        <h3 id="scoreTitle" style="font-family: 'Jua', sans-serif; color: #6C5980; font-size: 1.25rem;">참 잘했어요!</h3>
        <p id="scoreMessage" style="font-size: 0.95rem; color: #8D7B9D;">9문제 중 9문제를 완벽하게 풀었어요!</p>
      </div>
    </div>
    <button class="action-btn" onclick="closeScoreBanner()" style="padding: 4px 12px; font-size: 0.85rem;">닫기</button>
  </div>

  <!-- 학습지 1장 화면 (동적 렌더링) -->
  <main class="worksheet-container worksheet-view" id="worksheetView">
    <!-- 코너 장식 클라우드 -->
    <svg class="corner-deco corner-tl" viewBox="0 0 36 36" fill="none">
      <circle cx="12" cy="18" r="8" fill="#FFB5C2" fill-opacity="0.4"/>
      <circle cx="20" cy="14" r="10" fill="#B5D8F7" fill-opacity="0.4"/>
    </svg>
    <svg class="corner-deco corner-tr" viewBox="0 0 36 36" fill="none">
      <circle cx="12" cy="18" r="8" fill="#FFB5C2" fill-opacity="0.4"/>
      <circle cx="20" cy="14" r="10" fill="#B5D8F7" fill-opacity="0.4"/>
    </svg>

    <!-- 메타 영역 -->
    <div class="sheet-meta">
      <div class="sheet-title-box">
        <span class="sheet-badge" id="sheetBadge">제 1 쪽</span>
        <h2 class="sheet-title">세로셈 곱셈 원리 쏙쏙</h2>
      </div>
      <div class="sheet-info-fields">
        <div class="info-field">
          <span>날짜:</span>
          <span class="info-line"></span>
        </div>
        <div class="info-field">
          <span>이름:</span>
          <span class="info-line"></span>
        </div>
        <div class="info-field">
          <span>맞힌 개수:</span>
          <span style="font-family: 'Jua', sans-serif; color: #E25B77;" id="sheetScoreDisplay"> / 9</span>
        </div>
      </div>
    </div>

    <!-- 9문제 그리드 -->
    <div class="problems-grid" id="problemsGrid">
      <!-- 자바스크립트로 9문제 렌더링 -->
    </div>

    <!-- 학습지 푸터 장식 -->
    <div class="sheet-footer">
      <div class="footer-mascot">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#FFCCD5"/>
          <path d="M8 12Q12 16 16 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>일의 자리와 십의 자리를 차근차근 곱해 더해 보아요! 🌸</span>
      </div>
      <span style="font-family: 'Jua', sans-serif;" id="footerPageNumber">1 / 5 쪽</span>
    </div>
  </main>

  <!-- 전체 정답지 화면 -->
  <main class="worksheet-container answer-key-view" id="answerKeyView">
    <div class="sheet-meta">
      <div class="sheet-title-box">
        <span class="sheet-badge" style="background: #64B5F6;">정답 및 풀이</span>
        <h2 class="sheet-title">전체 5페이지 정답 한눈에 보기 📘</h2>
      </div>
      <button class="action-btn" onclick="switchPage(1)">돌아가기</button>
    </div>

    <div class="answer-key-grid" id="answerKeyGrid">
      <!-- 자바스크립트로 5개 페이지 정답 렌더링 -->
    </div>
  </main>

  <!-- 인쇄 전용 5페이지 묶음 컨테이너 (브라우저 인쇄 시 자동으로 모두 출력) -->
  <div class="all-print-pages" id="allPrintPages">
    <!-- 자바스크립트로 5페이지 + 정답지 전부 생성 -->
  </div>

  <script>
    // 5페이지, 각 페이지당 9문제 (총 45문제)
    // 2학년 눈높이에 맞춘 단계적 난이도 구성
    // Page 1: 10~19 x 2~5 (예시 19x3 스타일 포함, 두 자리 곱셈 시작)
    // Page 2: 20~29 x 2~4
    // Page 3: 10~49 x 2~5 (받아올림 기본 연습)
    // Page 4: 30~69 x 3~6
    // Page 5: 12~99 x 2~9 (종합 실력 다지기)
    
    const pageProblemTemplates = [
      // Page 1 (예시 19 x 3 포함)
      [
        { num1: 19, num2: 3 },
        { num1: 14, num2: 2 },
        { num1: 16, num2: 4 },
        { num1: 12, num2: 5 },
        { num1: 18, num2: 3 },
        { num1: 13, num2: 4 },
        { num1: 15, num2: 3 },
        { num1: 17, num2: 2 },
        { num1: 19, num2: 4 }
      ],
      // Page 2
      [
        { num1: 23, num2: 3 },
        { num1: 26, num2: 2 },
        { num1: 24, num2: 4 },
        { num1: 21, num2: 5 },
        { num1: 27, num2: 3 },
        { num1: 25, num2: 4 },
        { num1: 28, num2: 2 },
        { num1: 22, num2: 6 },
        { num1: 29, num2: 3 }
      ],
      // Page 3
      [
        { num1: 32, num2: 4 },
        { num1: 35, num2: 3 },
        { num1: 43, num2: 2 },
        { num1: 38, num2: 3 },
        { num1: 46, num2: 2 },
        { num1: 34, num2: 5 },
        { num1: 48, num2: 3 },
        { num1: 37, num2: 4 },
        { num1: 45, num2: 4 }
      ],
      // Page 4
      [
        { num1: 52, num2: 4 },
        { num1: 56, num2: 3 },
        { num1: 64, num2: 3 },
        { num1: 58, num2: 2 },
        { num1: 63, num2: 4 },
        { num1: 57, num2: 5 },
        { num1: 68, num2: 3 },
        { num1: 54, num2: 6 },
        { num1: 65, num2: 4 }
      ],
      // Page 5
      [
        { num1: 72, num2: 4 },
        { num1: 75, num2: 3 },
        { num1: 83, num2: 3 },
        { num1: 76, num2: 5 },
        { num1: 84, num2: 4 },
        { num1: 89, num2: 2 },
        { num1: 92, num2: 4 },
        { num1: 95, num2: 3 },
        { num1: 88, num2: 6 }
      ]
    ];

    // 현재 문제 데이터 복사본
    let allPagesData = JSON.parse(JSON.stringify(pageProblemTemplates));
    let currentPage = 1;

    // 각 페이지의 사용자 입력 상태 저장용 { pageIdx: { problemIdx: { step1: '', step2: '', final: '' } } }
    let userInputs = {};

    function initUserInputs() {
      for (let p = 0; p < 5; p++) {
        userInputs[p] = {};
        for (let i = 0; i < 9; i++) {
          userInputs[p][i] = {
            step1: ['', ''],
            step2: ['', ''],
            final: ['', '', '']
          };
        }
      }
    }
    initUserInputs();

    // 곱셈 풀이 단계 계산 함수
    // 예: 19 * 3
    // 1) 9 * 3 = 27 (step1)
    // 2) 10 * 3 = 30 (step2)
    // 3) 27 + 30 = 57 (final: 057 or 57)
    function calculateSteps(num1, num2) {
      const tens = Math.floor(num1 / 10);
      const ones = num1 % 10;
      
      const step1Val = ones * num2;       // 일의 자리 x 곱하는 수 (예: 9 x 3 = 27)
      const step2Val = tens * num2 * 10;  // 십의 자리 x 곱하는 수 (예: 10 x 3 = 30)
      const finalVal = num1 * num2;       // 총합 (예: 57)

      // 박스 자리수에 맞춘 문자열 배열
      // step1: 항상 두 자리 (예: 27 -> ['2', '7'], 8 -> ['0', '8'] 또는 일의자리 '8' 빈칸)
      // 한국 초등 2학년 세로셈 교재 기준:
      // 9 x 3 = 27 (2칸)
      // 10 x 3 = 30 (2칸 또는 30 표기, 보통 십의 자리 곱셈은 30에서 3과 0 표기)
      const step1Str = step1Val.toString().padStart(2, '0');
      const step2Str = step2Val.toString().padStart(2, '0'); // 보통 세로셈 2단계에선 30 (혹은 3_)
      const finalStr = finalVal.toString().padStart(3, '0');

      return {
        ones,
        tens,
        step1Val,
        step2Val,
        finalVal,
        step1Digits: [step1Str[0], step1Str[1]],
        step2Digits: [step2Str[0], step2Str[1]],
        finalDigits: [finalStr[0], finalStr[1], finalStr[2]]
      };
    }

    // 화면에 현재 페이지 문제 9개 렌더링
    function renderWorksheet(pageNumber) {
      const pageIndex = pageNumber - 1;
      const problems = allPagesData[pageIndex];
      const grid = document.getElementById('problemsGrid');
      grid.innerHTML = '';

      document.getElementById('sheetBadge').innerText = `제 ${pageNumber} 쪽`;
      document.getElementById('footerPageNumber').innerText = `${pageNumber} / 5 쪽`;

      const pageTitles = [
        '기초 쑥쑥! 10대 수 곱셈 🎈',
        '자신감 뿜뿜! 20대 수 곱셈 🐰',
        '원리 쏙쏙! 30~40대 수 곱셈 ☁️',
        '실력 탄탄! 50~60대 수 곱셈 🌟',
        '곱셈 왕 도전! 종합 세로셈 모험 👑'
      ];
      document.querySelector('.sheet-title').innerText = pageTitles[pageIndex];

      problems.forEach((prob, idx) => {
        const steps = calculateSteps(prob.num1, prob.num2);
        const card = document.createElement('div');
        card.className = 'problem-card';
        card.id = `problem-card-${idx}`;

        const savedInput = userInputs[pageIndex][idx];

        card.innerHTML = `
          <div class="problem-number">${idx + 1}</div>
          <div class="problem-helper-tag">${prob.num1} × ${prob.num2}</div>
          
          <div class="vertical-math">
            <!-- 윗 수 (두 자릿수) -->
            <div class="math-row">
              <span>${prob.num1}</span>
            </div>

            <!-- 아랫 수 (한 자릿수) + X 기호 -->
            <div class="math-row operator-row">
              <span class="operator-symbol">×</span>
              <span>${prob.num2}</span>
            </div>

            <!-- 첫 번째 구분선 ---- -->
            <div class="divider-line"></div>

            <!-- 1단계: 일의 자리 곱 (예: 9 x 3 = 27) □□ -->
            <div class="step-row">
              <span class="step-explain">${steps.ones}×${prob.num2}</span>
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s1-0" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s1" data-digit="0"
                value="${savedInput.step1[0]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s1-1" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s1" data-digit="1"
                value="${savedInput.step1[1]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
            </div>

            <!-- 2단계: 십의 자리 곱 (예: 10 x 3 = 30) □□ -->
            <div class="step-row">
              <span class="step-explain">${steps.tens * 10}×${prob.num2}</span>
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s2-0" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s2" data-digit="0"
                value="${savedInput.step2[0]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-s2-1" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="s2" data-digit="1"
                value="${savedInput.step2[1]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
            </div>

            <!-- 두 번째 구분선 ---- -->
            <div class="sub-divider-line"></div>

            <!-- 3단계 최종 합산: □□□ -->
            <div class="step-row final-row">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-f-0" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="f" data-digit="0"
                value="${savedInput.final[0]}"
                placeholder="${steps.finalVal < 100 ? '' : ''}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-f-1" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="f" data-digit="1"
                value="${savedInput.final[1]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
              <input type="text" maxlength="1" class="box-input" 
                id="p${pageIndex}-prob${idx}-f-2" 
                data-page="${pageIndex}" data-prob="${idx}" data-stage="f" data-digit="2"
                value="${savedInput.final[2]}"
                oninput="handleInputMove(this)" onkeydown="handleKeyDown(event, this)">
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // 키보드 입력 시 자동으로 다음 박스로 슝 이동하는 친절한 인터랙션
    function handleInputMove(input) {
      const val = input.value.trim();
      const page = parseInt(input.dataset.page);
      const prob = parseInt(input.dataset.prob);
      const stage = input.dataset.stage;
      const digit = parseInt(input.dataset.digit);

      // 숫자 외 문자 제거
      if (!/^\d*$/.test(val)) {
        input.value = '';
        return;
      }

      // 상태 저장
      if (stage === 's1') userInputs[page][prob].step1[digit] = val;
      if (stage === 's2') userInputs[page][prob].step2[digit] = val;
      if (stage === 'f') userInputs[page][prob].final[digit] = val;

      // 다음 박스 자동 포커스
      if (val.length === 1) {
        const inputsInCard = Array.from(input.closest('.problem-card').querySelectorAll('.box-input'));
        const currIdx = inputsInCard.indexOf(input);
        if (currIdx >= 0 && currIdx < inputsInCard.length - 1) {
          inputsInCard[currIdx + 1].focus();
        }
      }
    }

    function handleKeyDown(e, input) {
      if (e.key === 'Backspace' && input.value === '') {
        const inputsInCard = Array.from(input.closest('.problem-card').querySelectorAll('.box-input'));
        const currIdx = inputsInCard.indexOf(input);
        if (currIdx > 0) {
          inputsInCard[currIdx - 1].focus();
        }
      }
    }

    // 탭 전환 함수
    function switchPage(page) {
      const tabs = document.querySelectorAll('#pageTabGroup .tab-btn');
      tabs.forEach(t => t.classList.remove('active'));

      const worksheetView = document.getElementById('worksheetView');
      const answerKeyView = document.getElementById('answerKeyView');

      if (page === 'answer') {
        worksheetView.classList.add('hidden');
        answerKeyView.classList.add('active');
        tabs[5].classList.add('active');
        renderAnswerKey();
      } else {
        currentPage = page;
        worksheetView.classList.remove('hidden');
        answerKeyView.classList.remove('active');
        tabs[page - 1].classList.add('active');
        renderWorksheet(currentPage);
      }
      closeScoreBanner();
    }

    // 채점하기 기능 (맞은 문제는 초록/파랑 빛, 틀린 문제는 핑크 빛 강조)
    function checkAnswers() {
      if (currentPage === 'answer') return;

      const pageIndex = currentPage - 1;
      const problems = allPagesData[pageIndex];
      let correctProblemCount = 0;

      problems.forEach((prob, idx) => {
        const steps = calculateSteps(prob.num1, prob.num2);
        const card = document.getElementById(`problem-card-${idx}`);
        let isProblemFullyCorrect = true;

        // 1) 1단계 검사
        const s1_0 = document.getElementById(`p${pageIndex}-prob${idx}-s1-0`);
        const s1_1 = document.getElementById(`p${pageIndex}-prob${idx}-s1-1`);
        const s1User = (s1_0.value + s1_1.value).trim();
        const s1Expected = steps.step1Val.toString();
        // 한 자리 수일 경우 빈칸 또는 0 허용 (예: 8 or 08)
        const s1Correct = (parseInt(s1User) === steps.step1Val);

        validateInputBox(s1_0, s1Correct);
        validateInputBox(s1_1, s1Correct);
        if (!s1Correct) isProblemFullyCorrect = false;

        // 2) 2단계 검사 (예: 10 x 3 = 30)
        const s2_0 = document.getElementById(`p${pageIndex}-prob${idx}-s2-0`);
        const s2_1 = document.getElementById(`p${pageIndex}-prob${idx}-s2-1`);
        const s2User = (s2_0.value + s2_1.value).trim();
        const s2Correct = (parseInt(s2User) === steps.step2Val);

        validateInputBox(s2_0, s2Correct);
        validateInputBox(s2_1, s2Correct);
        if (!s2Correct) isProblemFullyCorrect = false;

        // 3) 최종 합산 검사
        const f_0 = document.getElementById(`p${pageIndex}-prob${idx}-f-0`);
        const f_1 = document.getElementById(`p${pageIndex}-prob${idx}-f-1`);
        const f_2 = document.getElementById(`p${pageIndex}-prob${idx}-f-2`);
        const fUser = (f_0.value + f_1.value + f_2.value).trim();
        const fCorrect = (parseInt(fUser) === steps.finalVal);

        validateInputBox(f_0, fCorrect);
        validateInputBox(f_1, fCorrect);
        validateInputBox(f_2, fCorrect);
        if (!fCorrect) isProblemFullyCorrect = false;

        if (isProblemFullyCorrect) {
          correctProblemCount++;
        }
      });

      // 점수 표시 업데이트
      document.getElementById('sheetScoreDisplay').innerText = `${correctProblemCount} / 9`;

      // 배너 띄우기
      const banner = document.getElementById('scoreBanner');
      const scoreIcon = document.getElementById('scoreIcon');
      const scoreTitle = document.getElementById('scoreTitle');
      const scoreMessage = document.getElementById('scoreMessage');

      banner.classList.add('show');
      if (correctProblemCount === 9) {
        scoreIcon.innerText = '🌸';
        scoreTitle.innerText = '와아, 100점 만점이에요!';
        scoreMessage.innerText = '9문제를 모두 완벽하게 맞혔어요! 솜사탕처럼 달콤한 곱셈 박사님!';
      } else if (correctProblemCount >= 6) {
        scoreIcon.innerText = '⭐';
        scoreTitle.innerText = '참 잘했어요!';
        scoreMessage.innerText = `9문제 중 ${correctProblemCount}문제를 맞혔어요. 틀린 문제도 조금만 다시 생각해보면 맞힐 수 있어요!`;
      } else {
        scoreIcon.innerText = '🧸';
        scoreTitle.innerText = '차근차근 다시 해보아요!';
        scoreMessage.innerText = `9문제 중 ${correctProblemCount}문제를 맞혔어요. 일의 자리와 십의 자리를 나누어 곱해보세요.`;
      }
    }

    function validateInputBox(input, isCorrect) {
      if (!input) return;
      input.classList.remove('correct', 'incorrect');
      if (input.value.trim() !== '') {
        input.classList.add(isCorrect ? 'correct' : 'incorrect');
      } else {
        if (!isCorrect) input.classList.add('incorrect');
      }
    }

    function closeScoreBanner() {
      document.getElementById('scoreBanner').classList.remove('show');
    }

    // 현재 페이지 다시 풀기 (초기화)
    function resetCurrentPage() {
      const pageIndex = currentPage - 1;
      for (let i = 0; i < 9; i++) {
        userInputs[pageIndex][i] = {
          step1: ['', ''],
          step2: ['', ''],
          final: ['', '', '']
        };
      }
      document.getElementById('sheetScoreDisplay').innerText = ` / 9`;
      renderWorksheet(currentPage);
      closeScoreBanner();
    }

    // 새로운 랜덤 문제 생성 (원할 때 무한 생성 가능)
    function generateNewNumbers() {
      const pageIndex = currentPage - 1;
      const newProbs = [];
      for (let i = 0; i < 9; i++) {
        let num1, num2;
        if (pageIndex === 0) {
          num1 = Math.floor(Math.random() * 10) + 10; // 10~19
          num2 = Math.floor(Math.random() * 4) + 2;  // 2~5
        } else if (pageIndex === 1) {
          num1 = Math.floor(Math.random() * 10) + 20; // 20~29
          num2 = Math.floor(Math.random() * 4) + 2;
        } else if (pageIndex === 2) {
          num1 = Math.floor(Math.random() * 20) + 30; // 30~49
          num2 = Math.floor(Math.random() * 4) + 2;
        } else if (pageIndex === 3) {
          num1 = Math.floor(Math.random() * 20) + 50; // 50~69
          num2 = Math.floor(Math.random() * 5) + 2;
        } else {
          num1 = Math.floor(Math.random() * 30) + 70; // 70~99
          num2 = Math.floor(Math.random() * 6) + 2;
        }
        newProbs.push({ num1, num2 });
      }
      allPagesData[pageIndex] = newProbs;
      resetCurrentPage();
      buildAllPrintPages();
    }

    // 전체 5페이지 정답지 렌더링
    function renderAnswerKey() {
      const grid = document.getElementById('answerKeyGrid');
      grid.innerHTML = '';

      allPagesData.forEach((probs, pIdx) => {
        const card = document.createElement('div');
        card.className = 'answer-page-card';
        card.innerHTML = `
          <div class="answer-page-title">
            <span>🌸</span> 제 ${pIdx + 1} 쪽 정답표
          </div>
          <ul class="answer-list">
            ${probs.map((p, i) => {
              const steps = calculateSteps(p.num1, p.num2);
              return `
                <li class="answer-item">
                  <span class="answer-calc"><strong>${i + 1}번:</strong> ${p.num1} × ${p.num2} = <strong>${steps.finalVal}</strong></span>
                  <span class="answer-steps">(${steps.step1Val} + ${steps.step2Val})</span>
                </li>
              `;
            }).join('')}
          </ul>
        `;
        grid.appendChild(card);
      });
    }

    // 인쇄 시 5페이지 + 정답지가 깔끔한 A4 양식으로 인쇄되도록 DOM 빌드
    function buildAllPrintPages() {
      const container = document.getElementById('allPrintPages');
      container.innerHTML = '';

      // 5개 문제 페이지 생성
      allPagesData.forEach((probs, pIdx) => {
        const pageEl = document.createElement('div');
        pageEl.className = 'worksheet-container';
        pageEl.innerHTML = `
          <div class="sheet-meta">
            <div class="sheet-title-box">
              <span class="sheet-badge">제 ${pIdx + 1} 쪽</span>
              <h2 class="sheet-title">두 자릿수 × 한 자릿수 세로셈 연습장</h2>
            </div>
            <div class="sheet-info-fields">
              <div class="info-field"><span>날짜:</span> <span class="info-line"></span></div>
              <div class="info-field"><span>이름:</span> <span class="info-line"></span></div>
              <div class="info-field"><span>점수:</span> <span class="info-line"></span></div>
            </div>
          </div>
          <div class="problems-grid">
            ${probs.map((prob, idx) => {
              const steps = calculateSteps(prob.num1, prob.num2);
              return `
                <div class="problem-card">
                  <div class="problem-number">${idx + 1}</div>
                  <div class="vertical-math">
                    <div class="math-row"><span>${prob.num1}</span></div>
                    <div class="math-row operator-row">
                      <span class="operator-symbol">×</span>
                      <span>${prob.num2}</span>
                    </div>
                    <div class="divider-line"></div>
                    <div class="step-row">
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                    </div>
                    <div class="step-row">
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                    </div>
                    <div class="sub-divider-line"></div>
                    <div class="step-row final-row">
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                      <input type="text" class="box-input">
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="sheet-footer">
            <span>초등학교 2학년 곱셈 구구 및 세로셈 단계별 익히기</span>
            <span>${pIdx + 1} / 5 쪽</span>
          </div>
        `;
        container.appendChild(pageEl);
      });

      // 정답지 인쇄 페이지 추가
      const ansPage = document.createElement('div');
      ansPage.className = 'worksheet-container';
      ansPage.innerHTML = `
        <div class="sheet-meta">
          <div class="sheet-title-box">
            <span class="sheet-badge" style="background:#407BB5;">정답 및 해설</span>
            <h2 class="sheet-title">전체 정답표 (1~5쪽)</h2>
          </div>
        </div>
        <div class="answer-key-grid">
          ${allPagesData.map((probs, pIdx) => `
            <div class="answer-page-card">
              <div class="answer-page-title">제 ${pIdx + 1} 쪽 정답</div>
              <ul class="answer-list">
                ${probs.map((p, i) => {
                  const steps = calculateSteps(p.num1, p.num2);
                  return `
                    <li class="answer-item">
                      <span>${i + 1}번: ${p.num1}×${p.num2} = <strong>${steps.finalVal}</strong></span>
                      <span>(${steps.step1Val}+${steps.step2Val})</span>
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(ansPage);
    }

    // 초기화 실행
    renderWorksheet(1);
    buildAllPrintPages();
  </script>
</body>
</html>
